<section class="artisan-detail">

  <div class="container py-5">

    @if (artisan) {

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h1 class="text-primary mb-2">
                            {{ artisan.name }}
                        </h1>

                        <h4 class="text-secondary mb-3">
                            {{ artisan.specialty }}
                        </h4>

                        <div class="d-flex align-items-center gap-3 mb-3">

                            <span>
                                📍 {{ artisan.city }}
                            </span>

                            <app-rating
                                [rating]="artisan.rating">
                            </app-rating>

                        </div>

                        <div class="mb-4">

                            <h5>À propos</h5>

                            <p class="mb-0">
                                {{ artisan.about }}
                            </p>

                        </div>

                        <div class="bg-light p-3 rounded">

                            <h5>Coordonnées</h5>

                            <p class="mb-2">
                                <strong>Email :</strong>
                                <a [href]="'mailto:' + artisan.email">
                                {{ artisan.email }}
                                </a>
                            </p>

                            <p class="mb-0">
                                <strong>Site internet :</strong>
                                <a
                                [href]="artisan.website"
                                target="_blank"
                                rel="noopener noreferrer">
                                {{ artisan.website }}
                                </a>
                            </p>

                        </div>

                        <div class="mt-4">

                            <a
                                routerLink="/"
                                class="btn btn-primary">
                                ← Retour à l'accueil
                            </a>

                        </div>

                    </div>
                </div>

            </div>
        </div>
        
        } @else {

            <p>Artisan introuvable.</p>

    }

  </div>

</section>
