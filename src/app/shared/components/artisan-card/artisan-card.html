<div class="card h-100 shadow-sm">

  <div class="card-body">

    <h3 class="card-title">
      {{ artisan.name }}
    </h3>

    <h5 class="text-primary">
      {{ artisan.specialty }}
    </h5>

    <p class="text-muted">
      📍 {{ artisan.city }}
    </p>

    <app-rating
      [rating]="artisan.rating">
    </app-rating>

    <p class="mt-3">
      {{ artisan.about }}
    </p>

  </div>

  <div class="card-footer bg-white border-0">

    <a
      class="btn btn-primary w-100"
      [routerLink]="['/artisan', artisan.id]">

      Voir le profil

    </a>

  </div>

</div>
